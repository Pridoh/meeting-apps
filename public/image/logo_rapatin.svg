<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%">
  <defs>
    <!-- Gradasi halus mengikuti pencahayaan gambar referensi -->
    <linearGradient id="navyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3C426B" />
      <stop offset="100%" stop-color="#454B78" />
    </linearGradient>

    <linearGradient id="periwinkleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9CA9DC" />
      <stop offset="100%" stop-color="#B0BCE6" />
    </linearGradient>

    <linearGradient id="lavenderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E4DFFA" />
      <stop offset="100%" stop-color="#CFC6F4" />
    </linearGradient>

    <linearGradient id="lightLavenderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F6F1FF" />
      <stop offset="100%" stop-color="#ECE5FD" />
    </linearGradient>
  </defs>

